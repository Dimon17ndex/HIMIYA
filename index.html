<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ХИМИЯ</title>

<!-- 🎨 Favicon: ХИМИЯ белым на чёрном -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23000000'/><text x='100' y='118' font-family='Arial,sans-serif' font-size='44' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='1'>ХИМИЯ</text></svg>">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #000; font-family: -apple-system, 'Segoe UI', sans-serif; color: #fff; }

  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #1c1c1c 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #161616 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #121212 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
    opacity: 0;
    transform: scale(1.05);
    animation: bgAppear 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes bgAppear { to { opacity: 1; transform: scale(1); } }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    height: 90px;
    padding: 22px 20px 0 20px;
    background: #2a2a2a;
    opacity: 0;
    animation: fadeIn 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .dots-btn {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .dots-btn span {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #e0e0e0;
    opacity: 0.9;
    transition: all 0.25s ease;
  }
  .dots-btn:hover span,
  .dots-btn:active span { opacity: 1; transform: scale(1.3); }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="topbar">
    <button class="dots-btn" onclick="openMenu()" aria-label="Меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <script>
    function openMenu() { console.log('Меню открыто'); }
  </script>
</body>
</html>
