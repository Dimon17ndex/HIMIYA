<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Site</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== Рамка телефона ===== */
  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 40px;
    overflow: hidden;
    background: #0a0a0a;
    box-shadow:
      0 0 0 10px #1a1a1a,
      0 0 0 12px #2a2a2a,
      0 30px 80px rgba(0, 0, 0, 0.8);
  }

  /* ===== Градиентный фон ===== */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #3a3a3a 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #2a2a2a 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #1f1f1f 0%, transparent 60%),
      linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
    z-index: 0;
  }

  /* Легкое мерцание / движение фона */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  /* ===== Контент ===== */
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 60px 28px 40px;
    overflow-y: auto;
  }

  /* Статус-бар */
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 40px;
    opacity: 0.9;
  }

  /* Заголовок */
  .title {
    font-size: 42px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
    animation: fadeUp 0.8s ease-out;
  }

  .subtitle {
    font-size: 15px;
    color: #888;
    line-height: 1.5;
    margin-bottom: 40px;
    animation: fadeUp 0.8s ease-out 0.15s both;
  }

  /* Карточки */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: auto;
  }

  .card {
    padding: 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.3s ease;
    animation: fadeUp 0.8s ease-out both;
    cursor: pointer;
  }

  .card:nth-child(1) { animation-delay: 0.3s; }
  .card:nth-child(2) { animation-delay: 0.4s; }
  .card:nth-child(3) { animation-delay: 0.5s; }

  .card:active {
    transform: scale(0.97);
    background: rgba(255, 255, 255, 0.08);
  }

  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .card-text h3 {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 2px;
  }

  .card-text p {
    font-size: 12px;
    color: #777;
  }

  /* Кнопка */
  .btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #ffffff, #c0c0c0);
    color: #000;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    animation: fadeUp 0.8s ease-out 0.6s both;
    box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
  }

  .btn:active {
    transform: scale(0.97);
    box-shadow: 0 5px 20px rgba(255, 255, 255, 0.25);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Адаптив: на реальном телефоне убираем рамку */
  @media (max-width: 420px) {
    .phone {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="bg"></div>

    <div class="content">
      <!-- Статус-бар -->
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● ⚡ 100%</span>
      </div>

      <!-- Заголовок -->
      <h1 class="title">Привет 👋<br>Это твой сайт</h1>
      <p class="subtitle">Минималистичный дизайн с градиентным фоном. Всё в рамках экрана телефона.</p>

      <!-- Карточки -->
      <div class="cards">
        <div class="card">
          <div class="card-icon">⚡</div>
          <div class="card-text">
            <h3>Быстро</h3>
            <p>Мгновенная загрузка</p>
          </div>
        </div>
        <div class="card">
          <div class="card-icon">🎨</div>
          <div class="card-text">
            <h3>Красиво</h3>
            <p>Продуманный дизайн</p>
          </div>
        </div>
        <div class="card">
          <div class="card-icon">📱</div>
          <div class="card-text">
            <h3>Адаптивно</h3>
            <p>Идеально на телефоне</p>
          </div>
        </div>
      </div>

      <!-- Кнопка -->
      <button class="btn" onclick="start()">Начать →</button>
    </div>
  </div>

  <script>
    function start() {
      const btn = document.querySelector('.btn');
      btn.textContent = 'Загрузка...';
      btn.style.opacity = '0.7';

      setTimeout(() => {
        btn.textContent = 'Готово ✓';
        btn.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
        btn.style.color = '#fff';
      }, 1000);
    }

    // Плавное появление при загрузке
    window.addEventListener('load', () => {
      document.body.style.opacity = '0';
      document.body.style.transition = 'opacity 0.5s ease';
      requestAnimationFrame(() => {
        document.body.style.opacity = '1';
      });
    });
  </script>

</body>
</html>
