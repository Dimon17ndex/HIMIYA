<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ХИМИЯ</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #000;
  }

  /* ===== Градиентный фон (статичный, тёмный) ===== */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #1c1c1c 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #161616 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #121212 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
  }
</style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
