<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фон</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #000;
  }

  /* ===== Градиентный фон ===== */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #3a3a3a 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #2a2a2a 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #1f1f1f 0%, transparent 60%),
      linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
  }

  /* Лёгкое мерцание */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }
</style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
