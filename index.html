<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ХИМИЯ</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23000000'/><text x='100' y='118' font-family='Arial,sans-serif' font-size='44' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='1'>ХИМИЯ</text></svg>">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== 🔄 Лоадер ===== */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  .loader.hide { opacity: 0; }

  .spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== 🎬 Тексты ===== */
  .intro-text {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 10px;                /* ← минимальные отступы */
    text-align: center;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-size: 1.6rem;              /* ← тот же размер */

    /* 📱 Строго в одну линию */
    white-space: nowrap;

    pointer-events: none;

    opacity: 0;
    filter: blur(0);
    transform: translateY(-12px) scale(0.97);
    transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }

  /* Появление */
  .intro-text.show {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0) scale(1);
  }

  /* Уход в блюр (смена) */
  .intro-text.blur-out {
    opacity: 0;
    filter: blur(14px);
    transform: scale(1.05);
    transition: opacity 0.5s ease, filter 0.5s ease, transform 0.5s ease;
  }

  /* Приход из блюра */
  .intro-text.blur-in {
    opacity: 0;
    filter: blur(14px);
    transform: scale(0.95);
  }

  .intro-text.blur-in.show {
    opacity: 1;
    filter: blur(0);
    transform: scale(1);
    transition: opacity 0.5s ease, filter 0.5s ease, transform 0.5s ease;
  }

  /* Быстрое исчезновение на месте */
  .intro-text.hide {
    opacity: 0;
    filter: blur(14px);
    transform: scale(1);
    transition: opacity 0.3s ease, filter 0.3s ease;
  }

  /* ===== Фон ===== */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #1c1c1c 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #161616 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #121212 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
  }

  /* ===== 🔝 Вкладка ===== */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    padding: 0 22px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
  }

  .topbar.show {
    animation: fadeIn 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .brand {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ffffff 0%, #999999 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
  }

  .dots-btn {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  .dots-btn span {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #e0e0e0;
    opacity: 0.9;
    transition: all 0.25s ease;
  }
  .dots-btn:hover span,
  .dots-btn:active span { opacity: 1; transform: scale(1.3); }

  .grid { display: none; }
</style>
</head>
<body>

  <!-- Фон -->
  <div class="bg"></div>

  <!-- 🔄 Лоадер -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- 🎬 Текст 1 -->
  <div class="intro-text" id="text1">
    Химия — это определенно ваше!
  </div>

  <!-- 🎬 Текст 2 -->
  <div class="intro-text blur-in" id="text2">
    Удачного урока!
  </div>

  <!-- 🔝 Вкладка -->
  <div class="topbar" id="topbar">
    <div class="brand">ХИМИЯ</div>
    <button class="dots-btn" onclick="openMenu()" aria-label="Меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <script>
    const loader = document.getElementById('loader');
    const text1  = document.getElementById('text1');
    const text2  = document.getElementById('text2');
    const topbar = document.getElementById('topbar');

    // Лоадер 1.2 сек
    setTimeout(() => {
      loader.classList.add('hide');
    }, 1200);

    // Появление первого текста
    setTimeout(() => {
      text1.classList.add('show');
    }, 1450);

    // Смена с блюром
    setTimeout(() => {
      text1.classList.remove('show');
      text1.classList.add('blur-out');
      text2.classList.add('show');
    }, 2600);

    // Второй текст исчезает через блюр
    setTimeout(() => {
      text2.classList.remove('show');
      text2.classList.add('hide');
    }, 3800);

    // Вкладка
    setTimeout(() => {
      topbar.classList.add('show');
    }, 4000);

    function openMenu() { console.log('Меню открыто'); }
  </script>
</body>
</html>
