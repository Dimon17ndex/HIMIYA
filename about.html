<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>О проекте — ХИМИЯ</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23000000'/><text x='100' y='118' font-family='Arial,sans-serif' font-size='44' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='1'>ХИМИЯ</text></svg>">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== 🎬 Плавное появление всей страницы ===== */
  body {
    opacity: 1;
  }

  body.page-enter {
    opacity: 0;
    animation: pageAppear 1s ease-out 0.3s forwards;
  }

  @keyframes pageAppear {
    to { opacity: 1; }
  }

  /* ===== 🎬 Финальное затухание страницы ===== */
  body.fade-out {
    animation: none !important;
    transition: opacity 1.2s ease;
    opacity: 0;
  }

  /* ===== 🔄 Лоадер ===== */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .loader.hide { opacity: 0; }

  .spinner {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Фон ===== */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #1c1c1c 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #161616 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #121212 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
  }

  /* ===== 🔝 Верхняя панель ===== */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    padding: 0 22px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);

    opacity: 0;
    animation: fadeIn 0.9s cubic-bezier(0.4, 0, 0.2, 1) 1.6s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Название "ХИМИЯ" слева */
  .brand {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ffffff 0%, #999999 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    user-select: none;
  }

  /* Правый блок — стрелка + три точки */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* ⬅️ Кнопка "Назад" — стрелка влево */
  .back-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: opacity 0.25s ease;
  }

  .back-btn::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-left: 2px solid #e0e0e0;
    border-bottom: 2px solid #e0e0e0;
    transform: rotate(45deg);
    margin-left: 3px;
    transition: all 0.25s ease;
  }

  /* 💡 Эффект только для ПК */
  @media (hover: hover) and (pointer: fine) {
    .back-btn:hover::before {
      border-color: #ffffff;
      transform: rotate(45deg) scale(1.2);
    }
    .back-btn:active::before {
      transform: rotate(45deg) scale(0.9);
    }
  }

  /* Три точки */
  .dots-btn {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
    width: 20px;
    height: 20px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .dots-btn span {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #e0e0e0;
    opacity: 0.9;
    transition: all 0.25s ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .dots-btn:hover span,
    .dots-btn:active span {
      opacity: 1;
      transform: scale(1.3);
    }
  }

  /* 🚫 На мобильных — убираем эффекты стрелки и точек */
  body.mobile .back-btn:hover::before,
  body.mobile .back-btn:active::before {
    border-color: #e0e0e0 !important;
    transform: rotate(45deg) !important;
  }

  body.mobile .dots-btn span,
  body.mobile .dots-btn:hover span,
  body.mobile .dots-btn:active span {
    opacity: 0.9 !important;
    transform: none !important;
  }

  /* ===== 📄 Контент страницы ===== */
  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 720px;
    padding: 100px 30px 40px;
    height: 100%;
    overflow-y: auto;
    text-align: center;

    opacity: 0;
    animation: contentAppear 1s cubic-bezier(0.4, 0, 0.2, 1) 1.8s forwards;
  }

  @keyframes contentAppear {
    to { opacity: 1; }
  }

  .content h1 {
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .content p {
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 16px;
  }

  /* Скрываем скроллбар */
  .content::-webkit-scrollbar { width: 0; }
  .content { scrollbar-width: none; }
</style>
</head>
<body class="page-enter">

  <!-- Фон -->
  <div class="bg"></div>

  <!-- 🔄 Лоадер -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- 🔝 Верхняя панель -->
  <div class="topbar">
    <div class="brand">ХИМИЯ</div>

    <div class="topbar-right">
      <!-- ⬅️ Стрелка возврата -->
      <button class="back-btn" onclick="goBack()" aria-label="Назад"></button>

      <!-- Три точки -->
      <button class="dots-btn" onclick="openMenu()" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- 📄 Контент -->
  <div class="content">
    <h1>О ПРОЕКТЕ</h1>
    <p>Этот проект создан для изучения химии — науки о веществах, их составе, строении и превращениях.</p>
    <p>Здесь вы найдёте интерактивные молекулы, уроки и многое другое.</p>
    <p>Контент можно будет добавлять позже.</p>
  </div>

  <script>
    // ============================================================
    // 🤖 ОПРЕДЕЛЯЕМ УСТРОЙСТВО
    // ============================================================
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) && !window.MSStream;
    const isMobile = isAndroid || isIOS;

    if (isMobile) document.body.classList.add('mobile');

    console.log('Android:', isAndroid, '| iOS:', isIOS, '| Mobile:', isMobile);

    // ============================================================
    // 🎬 СНИМАЕМ КЛАСС page-enter ПОСЛЕ ПОЯВЛЕНИЯ
    // ============================================================
    setTimeout(() => {
      document.body.classList.remove('page-enter');
    }, 1500);

    // ============================================================
    // 🔄 ЛОАДЕР — крутится 1.2с, потом исчезает
    // ============================================================
    const loader = document.getElementById('loader');

    setTimeout(() => {
      loader.classList.add('hide');
    }, 1200);

    // ============================================================
    // ⬅️ ВОЗВРАТ НАЗАД — плавное затухание, потом переход
    // ============================================================
    let isLeaving = false;

    function goBack() {
      // 🛡️ Защита от двойного клика
      if (isLeaving) return;
      isLeaving = true;

      // 🚫 Блокируем все клики
      document.body.style.pointerEvents = 'none';

      // 🎬 Плавное затухание (1.2s)
      document.body.classList.add('fade-out');

      // ⏳ Ждём полного завершения затухания, потом переходим
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }

    // ============================================================
    // ⋮ МЕНЮ (пока заглушка)
    // ============================================================
    function openMenu() {
      console.log('Меню открыто');
    }
  </script>
</body>
</html>
