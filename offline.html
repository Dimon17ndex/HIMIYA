<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Нет подключения — ХИМИЯ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23000000'/><text x='100' y='118' font-family='Arial,sans-serif' font-size='44' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='1'>ХИМИЯ</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, #1c1c1c 0%, transparent 45%),
      radial-gradient(circle at 85% 70%, #161616 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #121212 0%, transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #030303 100%);
  }
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .brand {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ffffff 0%, #999999 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 30px;
    max-width: 420px;
    opacity: 0;
    animation: fadeIn 0.8s ease 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .icon {
    font-size: 3rem;
    margin-bottom: 20px;
    opacity: 0.6;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.08); }
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.6);
    margin-bottom: 28px;
  }
  .retry {
    padding: 14px 32px;
    background: #ffffff;
    color: #000;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .retry:hover  { transform: scale(1.05); box-shadow: 0 10px 28px rgba(255,255,255,0.2); }
  .retry:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="topbar"><div class="brand">ХИМИЯ</div></div>

  <div class="content">
    <div class="icon">⚡</div>
    <h1>НЕТ ПОДКЛЮЧЕНИЯ</h1>
    <p>Проверьте интернет-соединение и попробуйте снова</p>
    <button class="retry" onclick="location.reload()">Обновить</button>
  </div>
</body>
</html>
